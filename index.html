<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; media-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://generativelanguage.googleapis.com; worker-src 'self' blob:;"
    />
    <title>AudioSync</title>
  </head>
  <body>
    <div id="boot-splash" aria-live="polite" style="position:fixed;inset:0;display:grid;place-items:center;background:#09090b;color:#fafafa;font-family:Inter,system-ui,sans-serif;z-index:9999">
      <div style="display:flex;flex-direction:column;align-items:center;gap:14px;padding:24px">
        <img src="/logo.svg" alt="AudioSync logo" width="88" height="88" style="opacity:.95" />
        <div style="font-size:28px;font-weight:700;letter-spacing:-.02em">AudioSync</div>
        <div style="font-size:13px;color:#a1a1aa">Loading library, player, and offline cache…</div>
        <div style="width:180px;height:4px;background:#27272a;border-radius:999px;overflow:hidden">
          <span style="display:block;height:100%;width:42%;background:linear-gradient(90deg,#6366f1,#22d3ee);animation:boot-slide 1.2s ease-in-out infinite alternate"></span>
        </div>
      </div>
    </div>
    <style>
      @keyframes boot-slide { from { transform: translateX(-70%);} to { transform: translateX(140%);} }
    </style>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
