<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0c0c14"/>
      <stop offset="100%" stop-color="#13131e"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4f9cf7"/>
      <stop offset="100%" stop-color="#7ec8ff"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <!-- Rings -->
  <circle cx="256" cy="256" r="110" fill="none" stroke="#4f9cf7" stroke-width="3" opacity="0.9"/>
  <circle cx="256" cy="256" r="90" fill="none" stroke="#5aabe8" stroke-width="3" opacity="0.8"/>
  <circle cx="256" cy="256" r="70" fill="none" stroke="#6db8e0" stroke-width="3" opacity="0.7"/>
  <circle cx="256" cy="256" r="50" fill="none" stroke="#8fd0ee" stroke-width="3" opacity="0.6"/>
  <!-- EQ bars -->
  <rect x="231" y="238" width="6" height="36" rx="3" fill="#7ec8ff"><animate attributeName="height" values="18;44;18" dur="0.8s" repeatCount="indefinite"/><animate attributeName="y" values="250;226;250" dur="0.8s" repeatCount="indefinite"/></rect>
  <rect x="241" y="222" width="6" height="68" rx="3" fill="#4f9cf7"><animate attributeName="height" values="30;58;30" dur="0.8s" begin="0.15s" repeatCount="indefinite"/><animate attributeName="y" values="245;217;245" dur="0.8s" begin="0.15s" repeatCount="indefinite"/></rect>
  <rect x="251" y="232" width="6" height="48" rx="3" fill="#7ec8ff"><animate attributeName="height" values="22;56;22" dur="0.8s" begin="0.3s" repeatCount="indefinite"/><animate attributeName="y" values="244;216;244" dur="0.8s" begin="0.3s" repeatCount="indefinite"/></rect>
  <rect x="261" y="214" width="6" height="84" rx="3" fill="#4f9cf7"><animate attributeName="height" values="36;68;36" dur="0.8s" begin="0.45s" repeatCount="indefinite"/><animate attributeName="y" values="241;213;241" dur="0.8s" begin="0.45s" repeatCount="indefinite"/></rect>
  <rect x="271" y="228" width="6" height="56" rx="3" fill="#7ec8ff"><animate attributeName="height" values="26;62;26" dur="0.8s" begin="0.6s" repeatCount="indefinite"/><animate attributeName="y" values="242;214;242" dur="0.8s" begin="0.6s" repeatCount="indefinite"/></rect>
  <rect x="281" y="240" width="6" height="32" rx="3" fill="#4f9cf7"><animate attributeName="height" values="16;48;16" dur="0.8s" begin="0.75s" repeatCount="indefinite"/><animate attributeName="y" values="248;224;248" dur="0.8s" begin="0.75s" repeatCount="indefinite"/></rect>
  <!-- Text -->
  <text x="256" y="360" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="700" font-size="52" fill="white" letter-spacing="2">AudioSync</text>
  <text x="256" y="390" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="14" fill="#4f9cf7" letter-spacing="6">AUDIOBOOK PLAYER</text>
</svg>
